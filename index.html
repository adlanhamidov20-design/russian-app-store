<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090b14">
<title>RusApp Store</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #090b14;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
}

.container {
  max-width: 680px;
  margin: auto;
  padding: 20px 16px 40px;
}

header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 24px;
}

.logo {
  width: 49px;
  height: 49px;
  display: grid;
  place-items: center;
  border-radius: 16px;
  background: linear-gradient(135deg,#8b5cff,#5234c5);
  font-size: 26px;
}

h1 {
  margin: 0;
  font-size: 22px;
}

.subtitle {
  color: #9297aa;
  font-size: 12px;
  margin-top: 4px;
}

.hero {
  padding: 25px 21px;
  border-radius: 23px;
  background: linear-gradient(135deg,#38236f,#171d3c);
  margin-bottom: 20px;
}

.hero small {
  color: #c9baff;
  font-weight: bold;
}

.hero h2 {
  font-size: 26px;
  margin: 13px 0 8px;
}

.hero p {
  color: #c5c6d5;
  font-size: 14px;
  line-height: 1.5;
  margin: 0;
}

.search {
  width: 100%;
  background: #171b29;
  border: 1px solid #292f42;
  border-radius: 15px;
  padding: 15px;
  color: white;
  font-size: 15px;
  outline: none;
  margin-bottom: 17px;
}

.search:focus {
  border-color: #805cff;
}

.categories {
  display: flex;
  gap: 9px;
  overflow-x: auto;
  padding-bottom: 12px;
  scrollbar-width: none;
}

.category {
  flex-shrink: 0;
  background: #171b29;
  border: 1px solid #292f42;
  color: #c4c7d3;
  padding: 10px 15px;
  border-radius: 20px;
  cursor: pointer;
}

.category.active {
  background: #7654ed;
  border-color: #7654ed;
  color: white;
}

.section-title {
  font-size: 19px;
  margin: 19px 0 14px;
}

.apps {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 12px;
}

.app {
  background: #171b29;
  border: 1px solid #292f42;
  border-radius: 19px;
  padding: 14px;
  min-width: 0;
}

.app-icon {
  width: 58px;
  height: 58px;
  border-radius: 16px;
  background: #29233e;
  display: grid;
  place-items: center;
  font-size: 29px;
  overflow: hidden;
  margin-bottom: 12px;
}

.app-icon img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.app h3 {
  font-size: 15px;
  margin: 0 0 6px;
}

.app p {
  color: #969bad;
  font-size: 12px;
  line-height: 1.4;
  min-height: 34px;
  margin: 0 0 13px;
}

.install {
  display: block;
  background: #7654ed;
  color: white;
  text-align: center;
  padding: 11px 5px;
  border-radius: 11px;
  text-decoration: none;
  font-size: 13px;
  font-weight: 600;
}

.install:active {
  opacity: .7;
}

.empty {
  display: none;
  color: #999;
  text-align: center;
  padding: 30px 5px;
  grid-column: 1 / -1;
}

footer {
  color: #777e91;
  text-align: center;
  font-size: 12px;
  line-height: 1.6;
  margin-top: 30px;
}

@media(max-width:350px) {
  .apps {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>
<main class="container">

<header>
  <div class="logo">🇷🇺</div>
  <div>
    <h1>RusApp Store</h1>
    <div class="subtitle">Российские приложения для iPhone</div>
  </div>
</header>

<section class="hero">
  <small>🍎 ТВОЙ МАГАЗИН ПРИЛОЖЕНИЙ</small>
  <h2>Всё для твоего iPhone</h2>
  <p>Находи любимые российские приложения в одном месте.</p>
</section>

<input
  class="search"
  id="search"
  type="search"
  placeholder="🔍 Поиск приложений..."
>

<div class="categories" id="categories">
  <button class="category active" data-category="Все">Все</button>
  <button class="category" data-category="Соцсети">Соцсети</button>
  <button class="category" data-category="Покупки">Покупки</button>
  <button class="category" data-category="Музыка">Музыка</button>
  <button class="category" data-category="Карты">Карты</button>
  <button class="category" data-category="Сервисы">Сервисы</button>
</div>

<h2 class="section-title">⭐ Популярные приложения</h2>
<div class="apps" id="apps"></div>

<footer>
  RusApp Store © 2026<br>
  Неофициальный каталог приложений.<br>
  Доступность зависит от региона Apple ID и App Store.
</footer>

</main>

<script>
const tg = window.Telegram?.WebApp;

if (tg) {
  tg.ready();
  tg.expand();
}

const appList = [
  {
    name: "ВКонтакте",
    searchName: "VK",
    icon: "💙",
    category: "Соцсети",
    desc: "Общение, музыка и видео"
  },
  {
    name: "Одноклассники",
    searchName: "Одноклассники",
    icon: "🟠",
    category: "Соцсети",
    desc: "Общение с друзьями"
  },
  {
    name: "Яндекс Браузер",
    searchName: "Яндекс Браузер",
    icon: "🔴",
    category: "Сервисы",
    desc: "Быстрый интернет и поиск"
  },
  {
    name: "Ozon",
    searchName: "Ozon",
    icon: "🔵",
    category: "Покупки",
    desc: "Интернет-магазин"
  },
  {
    name: "Wildberries",
    searchName: "Wildberries",
    icon: "🟣",
    category: "Покупки",
    desc: "Покупки онлайн"
  },
  {
    name: "2ГИС",
    searchName: "2GIS",
    icon: "📍",
    category: "Карты",
    desc: "Карты и справочник"
  },
  {
    name: "Яндекс Музыка",
    searchName: "Яндекс Музыка",
    icon: "🎵",
    category: "Музыка",
    desc: "Музыка и подкасты"
  },
  {
    name: "Яндекс Go",
    searchName: "Яндекс Go",
    icon: "🚕",
    category: "Сервисы",
    desc: "Поездки и доставка"
  },
  {
    name: "VK Видео",
    searchName: "VK Видео",
    icon: "▶️",
    category: "Соцсети",
    desc: "Видео и трансляции"
  }
];

const appsElement = document.getElementById("apps");
const searchElement = document.getElementById("search");

let selectedCategory = "Все";

function renderApps() {
  const query = searchElement.value.trim().toLowerCase();

  const filtered = appList.filter(app => {
    const categoryMatch =
      selectedCategory === "Все" ||
      app.category === selectedCategory;

    const searchMatch =
      app.name.toLowerCase().includes(query) ||
      app.desc.toLowerCase().includes(query);

    return categoryMatch && searchMatch;
  });

  appsElement.innerHTML = "";

  if (filtered.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.style.display = "block";
    empty.textContent = "Ничего не найдено 😕";
    appsElement.appendChild(empty);
    return;
  }

  filtered.forEach(app => {
    const card = document.createElement("article");
    card.className = "app";

    const icon = document.createElement("div");
    icon.className = "app-icon";
    icon.textContent = app.icon;

    const title = document.createElement("h3");
    title.textContent = app.name;

    const description = document.createElement("p");
    description.textContent = app.desc;

    const link = document.createElement("a");
    link.className = "install";
    link.textContent = "Открыть в App Store";
    link.href =
      "https://apps.apple.com/ru/search?term=" +
      encodeURIComponent(app.searchName);
    link.target = "_blank";
    link.rel = "noopener noreferrer";

    card.append(icon, title, description, link);
    appsElement.appendChild(card);

    loadIcon(app, icon);
  });
}

async function loadIcon(app, iconElement) {
  try {
    const url =
      "https://itunes.apple.com/search?term=" +
      encodeURIComponent(app.searchName) +
      "&entity=software&country=ru&limit=20";

    const response = await fetch(url);

    if (!response.ok) return;

    const data = await response.json();

    const normalize = value =>
      value.toLowerCase().replace(/[^a-zа-яё0-9]/gi, "");

    const wanted = normalize(app.searchName);

    const result = data.results?.find(item => {
      const actual = normalize(item.trackName || "");
      return actual === wanted ||
        actual.includes(wanted) ||
        wanted.includes(actual);
    });

    if (!result || !result.artworkUrl512) return;

    const image = document.createElement("img");
    image.src = result.artworkUrl512;
    image.alt = app.name;
    image.loading = "lazy";

    image.onerror = () => {
      image.remove();
    };

    iconElement.replaceChildren(image);

  } catch (error) {
    console.log("Не удалось загрузить иконку:", app.name);
  }
}

searchElement.addEventListener("input", renderApps);

document.querySelectorAll(".category").forEach(button => {
  button.addEventListener("click", () => {
    document.querySelector(".category.active")
      ?.classList.remove("active");

    button.classList.add("active");
    selectedCategory = button.dataset.category;

    renderApps();
  });
});

renderApps();
</script>
</body>
</html>
