<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>RusApp Store</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#f6f7fb;color:#171923;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 padding:22px 17px 35px;
}
header{padding:12px 2px 22px}
.logo{font-size:29px;font-weight:850;letter-spacing:-1.2px}
.logo span{color:#7357ed}
.subtitle{color:#9295a3;font-size:14px;margin-top:6px}
.search{
 width:100%;padding:16px;border:1px solid #e9eaf0;
 border-radius:17px;background:white;font-size:15px;
 outline:none;box-shadow:0 3px 12px #20243a08;
}
.search:focus{border-color:#927cf4}
h2{font-size:20px;margin:27px 0 15px}
.categories{
 display:flex;gap:9px;overflow-x:auto;
 padding:2px 0 8px;scrollbar-width:none;
}
.categories::-webkit-scrollbar{display:none}
.category{
 border:0;padding:11px 17px;border-radius:30px;
 background:white;color:#666a78;white-space:nowrap;
 font-size:13px;font-weight:650;
}
.category.active{background:#7357ed;color:white}
.featured{
 background:linear-gradient(120deg,#7357ed,#a18cf7);
 color:white;padding:22px;border-radius:23px;
 margin-top:20px;
}
.featured small{opacity:.8}
.featured h2{font-size:23px;margin:8px 0}
.featured p{font-size:13px;opacity:.9;margin-bottom:0}
.apps{display:grid;grid-template-columns:1fr;gap:12px}
.app{
 background:white;border:1px solid #eeeeF4;
 border-radius:19px;padding:14px;
 display:flex;align-items:center;gap:13px;
 box-shadow:0 4px 15px #20243a08;
}
.app-icon{
 width:57px;height:57px;border-radius:16px;
 display:flex;align-items:center;justify-content:center;
 font-size:29px;background:#f1efff;flex-shrink:0;
}
.info{flex:1;min-width:0}
.name{font-size:15px;font-weight:750}
.desc{font-size:12px;color:#9295a3;margin-top:5px}
.download{
 background:#7357ed;color:white;text-decoration:none;
 padding:10px 13px;border-radius:12px;
 font-size:12px;font-weight:700;white-space:nowrap;
}
.empty{text-align:center;color:#9295a3;padding:30px}
footer{text-align:center;color:#a3a5b0;font-size:12px;margin-top:35px}
</style>
</head>

<body>
<header>
 <div class="logo">Rus<span>App</span> Store</div>
 <div class="subtitle">Твои любимые приложения в одном месте 🇷🇺</div>
</header>

<input class="search" id="search" placeholder="🔍 Поиск приложений...">

<div class="featured">
 <small>ДОБРО ПОЖАЛОВАТЬ</small>
 <h2>Открывай новое 🚀</h2>
 <p>Находи полезные приложения каждый день</p>
</div>

<h2>Категории</h2>
<div class="categories" id="categories"></div>

<h2>Каталог приложений</h2>
<div class="apps" id="apps"></div>

<footer>RusApp Store · Независимый каталог приложений</footer>

<script>
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();}

const applications=[
 {name:"VK",category:"Соцсети",icon:"💙",desc:"Общение и музыка",url:"https://www.rustore.ru/catalog/app/com.vkontakte.android"},
 {name:"Одноклассники",category:"Соцсети",icon:"🟠",desc:"Общение с друзьями",url:"https://www.rustore.ru/catalog/app/ru.ok.android"},
 {name:"Яндекс Браузер",category:"Инструменты",icon:"🔴",desc:"Быстрый интернет",url:"https://www.rustore.ru/catalog/app/com.yandex.browser"},
 {name:"Ozon",category:"Покупки",icon:"🛍️",desc:"Интернет-магазин",url:"https://www.rustore.ru/catalog/app/ru.ozon.app"},
 {name:"RuStore",category:"Инструменты",icon:"📱",desc:"Магазин приложений",url:"https://www.rustore.ru/"},
 {name:"Яндекс Музыка",category:"Музыка",icon:"🎵",desc:"Музыка и подкасты",url:"https://www.rustore.ru/catalog/app/ru.yandex.music"},
 {name:"VK Видео",category:"Видео",icon:"▶️",desc:"Видео и развлечения",url:"https://www.rustore.ru/"},
 {name:"2ГИС",category:"Инструменты",icon:"🗺️",desc:"Карты и навигация",url:"https://www.rustore.ru/catalog/app/ru.dublgis.dgismobile"}
];

const categories=["Все",...new Set(applications.map(a=>a.category))];
let selected="Все";

const categoryBox=document.getElementById("categories");
const appBox=document.getElementById("apps");
const search=document.getElementById("search");

function renderCategories(){
 categoryBox.innerHTML="";
 categories.forEach(category=>{
  const b=document.createElement("button");
  b.className="category"+(selected===category?" active":"");
  b.textContent=category;
  b.onclick=()=>{
   selected=category;
   renderCategories();
   renderApps();
  };
  categoryBox.appendChild(b);
 });
}

function renderApps(){
 const q=search.value.trim().toLowerCase();
 const list=applications.filter(a=>
  a.name.toLowerCase().includes(q)&&
  (selected==="Все"||a.category===selected)
 );
 appBox.innerHTML="";
 if(!list.length){
  appBox.innerHTML='<div class="empty">Ничего не найдено 😔</div>';
  return;
 }
 list.forEach(a=>{
  const card=document.createElement("div");
  card.className="app";

  const icon=document.createElement("div");
  icon.className="app-icon";
  icon.textContent=a.icon;

  const info=document.createElement("div");
  info.className="info";

  const name=document.createElement("div");
  name.className="name";
  name.textContent=a.name;

  const desc=document.createElement("div");
  desc.className="desc";
  desc.textContent=a.desc;

  const link=document.createElement("a");
  link.className="download";
  link.textContent="Скачать";
  link.href=a.url;
  link.target="_blank";
  link.rel="noopener noreferrer";

  info.append(name,desc);
  card.append(icon,info,link);
  appBox.appendChild(card);
 });
}

search.addEventListener("input",renderApps);
renderCategories();
renderApps();
</script>
</body>
</html>
